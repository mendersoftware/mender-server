# the "mender-server/pkg"of the api spec
openapi: 3.0.1
info:
  title: Common Schemas
  version: "1.0"
  description: Shared schemas used across API specifications
paths: {}
components:
  schemas:
    Error:
      description: Error descriptor.
      example:
        error: error message
        request_id: f7881e82-0492-49fb-b459-795654e7188a
      properties:
        error:
          description: Description of the error.
          type: string
        request_id:
          description: Request ID (same as in X-MEN-RequestID header).
          type: string
      required:
        - error
      type: object
    NewTenant:
      type: object
      properties:
        tenant_id:
          type: string
          description: ID of new tenant.
      required:
        - tenant_id
    AuthSet:
      type: object
      description: >-
        AuthSet describes the identity a device uses to authenticate with the
        Mender server.
      properties:
        id:
          type: string
          description: The unique ID of the authentication set.
        device_id:
          type: string
          description: The unique ID of the device the authentication set belongs.
        identity_data:
          $ref: '#/components/schemas/IdentityData'
        pubkey:
          type: string
          description: >-
            The device's public key (PEM encoding). generated by the device or
            pre-provisioned by the vendor. Currently supported public algorithms
            are: RSA, Ed25519 and ECDSA P-256.
        status:
          type: string
          description: >-
            Authorization status of the set.
        ts:
          type: string
          format: date-time
          description: >-
            The creation timestamp of the authentication set.
    IdentityData:
      description: 'Device identity attributes, in the form of a JSON structure.
        The attributes are completely vendor-specific, the provided ones are just
        an example.
        In reference implementation structure contains vendor-selected fields,
        such as MACs, serial numbers, etc.'
      type: object
      additionalProperties: true
      example:
        mac: 00:01:02:03:04:05
        sku: My Device 1
        sn: SN1234567890
    ProvisionDevice:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
          description: ID of the new device.
      required:
      - device_id
    Scope:
      type: string
      description: |
        The scope of the attribute.

        Scope is a string and acts as namespace for the attribute name.

        * __inventory__: Attributes reported by the device.
        * __system__: Attributes populated by the mender-server.
        * __identity__: Device's identity attributes provided in the device's auth request.
        * __monitor__: Attributes populated by the monitoring add-on.
        * __tags__: User-defined attributes associated with the device.
      enum:
        - system
        - identity
        - inventory
        - monitor
        - tags
