include:
  - ../../../docker-compose.yml

name: backend-tests
services:
  integration-tester:
    depends_on:
      - create-artifact-worker
      - deployments
      - deviceauth
      - deviceconfig
      - deviceconnect
      - gui
      - inventory
      - iot-manager
      - mongo
      - nats
      - s3
      - s3-filer
      - s3-master
      - s3-volume
      - traefik
      - useradm
      - workflows
      - workflows-worker
    image: "${CI_REGISTRY_IMAGE:-localhost/backend-tester}:${CI_INTEGRATION_NG_IMAGE_TAG:-integration_v3.ng}"
    build:
      dockerfile: Dockerfile
    working_dir: /mender-server/backend/tests
    volumes:
      - ${MENDER_SERVER_PATH:-../../../}:/mender-server
      - go_pkg_mod:/go/pkg/mod/
      - go_build_cache:/root/.cache/go-build
      - go_tmp_cache:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      GOMODCACHE: /go/pkg/mod
      TENANTADM_STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME:-}

volumes:
  go_pkg_mod:
  go_build_cache:
  go_tmp_cache:
