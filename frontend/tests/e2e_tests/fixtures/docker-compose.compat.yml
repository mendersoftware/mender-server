# Older clients the server has to stay compatible with. They are started by the client compatibility tests
# (integration/03-advanced/40-clientCompatibility.spec.ts) as a compose project of their own, late in the test run.
# - the hostname makes up the device identity, so it has to be unique
# - the client-version label is the mender_client_version the client reports in its inventory, which can differ from the image tag
# - the connect-version label is only set where a test relies on the shipped mender-connect version
# NB! all files are passed as config content, as bind mounts would be resolved on the docker host, which is not where the tests run
# in the dockerized setup.
x-compat-client: &compat-client
  privileged: true
  stdin_open: true
  tty: true
  configs:
    - source: client_json
      target: /etc/mender/mender.conf
    # aligns the device type across images - the addons image would report generic-x86_64 otherwise
    - source: device_type
      target: /var/lib/mender/device_type
    - source: identity
      target: /usr/share/mender/identity/mender-device-identity
      mode: 0555

services:
  compat-client-2-0-1:
    <<: *compat-client
    image: ${MIRROR_REGISTRY:-docker.io}/mendersoftware/mender-client-docker:2.0.1
    hostname: compat-client-2-0-1
    labels:
      io.mender.e2e.client-version: '2.0.1'
  compat-client-2-1-3:
