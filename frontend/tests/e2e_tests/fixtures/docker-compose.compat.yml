configs:
  client_json:
    content: |
      {
        "InventoryPollIntervalSeconds": 5,
        "RetryPollIntervalSeconds": 5,
        "ServerURL": "${SERVER_URL}",
        "TenantToken": "${TENANT_TOKEN:-}",
        "UpdatePollIntervalSeconds": 5
      }
  device_type:
    content: device_type=docker-client
  # old clients execute this directly, so the shebang is required
  identity:
    content: |
      #!/bin/sh
      echo "hostname=$$(cat /etc/hostname)"
      echo "mac=01:02:03:04:05:06"
