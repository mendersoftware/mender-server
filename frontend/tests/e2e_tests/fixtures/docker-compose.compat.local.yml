# Additions for the clients from docker-compose.compat.yml to reach the local test stack: they join its network & trust its
# self-signed certificate. Older clients don't pick up the certificate location the regular client uses, so it is passed explicitly.
x-local-client: &local-client
  configs:
    - source: client_json
      target: /etc/mender/mender.conf
    - source: device_type
      target: /var/lib/mender/device_type
    - source: identity
      target: /usr/share/mender/identity/mender-device-identity
      mode: 0555
    - source: server_cert
      target: /etc/mender/server.crt

services:
  compat-client-2-0-1: *local-client
  compat-client-2-1-3: *local-client
  compat-client-2-2-1: *local-client
  compat-client-2-3-2: *local-client
  compat-client-2-4-2: *local-client
  compat-client-2-5-4: *local-client
  compat-client-2-6-1: *local-client
  compat-client-3-0-2: *local-client
  compat-client-3-1-1: *local-client
  compat-client-3-2-2: *local-client
  compat-client-3-3-2: *local-client
  compat-client-3-4-0: *local-client
  compat-client-3-5-1: *local-client
  compat-client-3-6-5: *local-client
  compat-client-3-7-9: *local-client
  compat-client-5-0-0: *local-client
  compat-client-6-0-0: *local-client

networks:
  default:
    name: gui-tests_default
    external: true

configs:
  client_json:
    content: |
      {
        "InventoryPollIntervalSeconds": 5,
        "RetryPollIntervalSeconds": 5,
        "ServerCertificate": "/etc/mender/server.crt",
        "ServerURL": "${SERVER_URL}",
        "TenantToken": "${TENANT_TOKEN:-}",
        "UpdatePollIntervalSeconds": 5
      }
  # the certificate from compose/certs/mender.crt
